<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — Víctor Cruz Granillo</title>
  <meta name="description" content="Notas y artículos de Víctor Cruz Granillo sobre desarrollo de software.">
  <link rel="icon" type="image/svg+xml" href="./brand/vc-line.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./v2.css">
  <link rel="stylesheet" href="./blog.css">
</head>
<body>

  <header class="nav">
    <a class="brand" href="./index.html" aria-label="Víctor Cruz — inicio">
      <svg class="brand-mark" viewBox="110 142 396 256" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="butt" stroke-linejoin="miter">
          <path d="M128 160 L224 380 L320 160"/>
          <path d="M451.1 194.3 A96 96 0 1 0 451.1 345.7"/>
        </g>
      </svg>
      <span class="brand-name">Vic CG</span>
    </a>

    <button class="menu-toggle" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú">
      <svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1.5">
          <line x1="0" y1="1" x2="22" y2="1"/>
          <line x1="0" y1="13" x2="22" y2="13"/>
        </g>
      </svg>
    </button>

    <nav id="menu" class="menu" aria-label="Principal">
      <a href="./index.html#sobre-mi">Sobre mí</a>
      <a href="./index.html#experiencia">Experiencia</a>
      <a href="./index.html#stack">Stack</a>
      <a href="./index.html#cursos">Cursos</a>
      <a href="./blog.html" aria-current="page">Blog</a>
      <a href="./index.html#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="wrap blog-page">
      <h1>Blog</h1>
      <p class="claim">Notas sobre lo que construyo y lo que voy aprendiendo.</p>
      <!-- one card per post, posts come from data/blog.json and open over the grid -->
      <div id="blog_posts"></div>
    </section>
  </main>

  <script>
    const toggle = document.querySelector('.menu-toggle');
    const menu = document.getElementById('menu');

    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
    });

    menu.addEventListener('click', (event) => {
      if (event.target.tagName === 'A') {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  </script>

  <script type="module">
    import {initBlog} from './js/modules/BlogReader/rendering.mjs'
    //card titles are h2 here, the page title is the only h1
    initBlog('blog_posts', 'data/blog.json', {headingLevel: 2})
  </script>

</body>
</html>
